services:
  - type: web
    name: options-agent-dashboard
    runtime: static
    repo: https://github.com/xmarin/options-agent
    branch: main
    buildCommand: python3 build_static.py
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

  - type: web
    name: options-agent-webhook
    runtime: python
    repo: https://github.com/xmarin/options-agent
    branch: main
    rootDir: .
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 webhook_server.py
    envVars:
      - key: WEBHOOK_SECRET
        sync: false   # set manually in Render dashboard
      - key: PARTNER_RAW_BASE_URL
        value: https://raw.githubusercontent.com/dmarinb/danilo-picks/main/published
      - key: PARTNER_OUTPUT_FILE
        value: published/danilo_picks_latest.json

  - type: cron
    name: options-agent-monday-job
    runtime: python
    repo: https://github.com/xmarin/options-agent
    branch: main
    rootDir: .
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: |
      python3 -m scanner.covered_call_scanner_tradier && \
      python3 generate_weekly_summary.py && \
      python3 build_trade_history_json.py && \
      python3 build_live_overlay.py && \
      python3 build_picks_json.py && \
      python3 fetch_danilo_picks.py && \
      python3 publish_reports_to_github.py
    schedule: "0 14 * * 1"
    envVars:
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # set manually in Render dashboard -- server-side only, never expose to the dashboard/browser.
                       # Lets the scanner read `positions.avg_cost` (RLS there is authenticated-only, unlike
                       # `trades`) to enforce a cost-basis floor on suggested strikes. Optional: if unset, that
                       # filter just no-ops and everything else runs normally.