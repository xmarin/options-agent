<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Agent Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --panel-2: #182240;
      --text: #e9eefc;
      --muted: #9fb0d9;
      --accent: #6ea8fe;
      --good: #2fbf71;
      --bad: #ff5d5d;
      --border: #24325f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #101830 100%);
      color: var(--text);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 { margin: 0; font-size: 2rem; }
    h2 { margin: 0 0 12px 0; font-size: 1.2rem; }
    .sub { margin-top: 8px; color: var(--muted); }

    .panel {
      background: rgba(18, 26, 51, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    button, select {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: #081225;
      font-weight: 700;
      border: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 1400px) {
      .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 1150px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
    }

    .stock-card {
      background: rgba(24, 34, 64, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .rank { color: var(--muted); font-size: 0.85rem; }
    .ticker { font-size: 1.65rem; font-weight: 800; margin-top: 4px; }
    .score { margin-top: 6px; color: var(--muted); font-weight: 600; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      background: rgba(11, 16, 32, 0.5);
      border: 1px solid rgba(36, 50, 95, 0.6);
      border-radius: 12px;
      padding: 10px;
    }

    .label { color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
    .value { font-size: 1rem; font-weight: 700; line-height: 1.2; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .yes { background: rgba(255,93,93,0.12); color: #ff9b9b; }
    .no { background: rgba(47,191,113,0.12); color: #89e0af; }
    .up { background: rgba(47,191,113,0.12); color: #89e0af; }
    .neutral { background: rgba(110,168,254,0.12); color: #9ec4ff; }
    .down { background: rgba(255,93,93,0.12); color: #ff9b9b; }

    .summary-box {
      white-space: pre-wrap;
      line-height: 1.5;
      color: var(--text);
    }

    ul { margin: 8px 0 0 18px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div>
        <h1>Options Agent Dashboard</h1>
        <div class="sub">Top 10 weekly covered-call candidates with AI summary and best trade.</div>
      </div>
      <div class="toolbar">
        <label for="reportSelect">Report:</label>
        <select id="reportSelect"></select>
        <button id="reloadBtn">Reload</button>
      </div>
    </div>

    <div class="panel">
      <h2>Best Trade of the Week</h2>
      <div id="bestTrade" class="summary-box">Loading...</div>
    </div>

    <div class="panel">
      <h2>AI Summary</h2>
      <div id="aiSummary" class="summary-box">Loading...</div>
      <div id="top10Notes"></div>
    </div>

    <div class="panel">
      <h2>Top 10 Candidates</h2>
      <div id="top10Cards" class="cards"></div>
    </div>
  </div>

  <script>
    const MANIFEST_URL = `published/reports_manifest.json?t=${Date.now()}`;

    function toNumber(value) {
      const n = Number(String(value).replace(/[%$]/g, "").trim());
      return Number.isFinite(n) ? n : null;
    }

    function fmt(value, digits = 2) {
      const n = toNumber(value);
      return n === null ? "—" : n.toFixed(digits);
    }

    function fmtInt(value) {
      const n = toNumber(value);
      return n === null ? "—" : Math.round(n).toLocaleString();
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = splitCSVLine(lines[0]);

      return lines.slice(1).filter(Boolean).map(line => {
        const values = splitCSVLine(line);
        const row = {};
        headers.forEach((h, i) => row[h] = values[i] ?? "");
        return row;
      });
    }

    function splitCSVLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function renderBestTrade(summary) {
      const el = document.getElementById("bestTrade");

      if (!summary || !summary.best_trade) {
        el.textContent = "No AI best-trade summary available.";
        return;
      }

      el.textContent =
        `${summary.best_trade.ticker}\n\n` +
        `Reason: ${summary.best_trade.reason}\n\n` +
        `Biggest risk: ${summary.best_trade.biggest_risk}`;
    }

    function renderAISummary(summary) {
      const summaryEl = document.getElementById("aiSummary");
      const notesEl = document.getElementById("top10Notes");

      if (!summary) {
        summaryEl.textContent = "No AI summary available.";
        notesEl.innerHTML = "";
        return;
      }

      summaryEl.textContent = summary.overall_summary || "No summary available.";

      const notes = summary.top_10_notes || [];
      if (!notes.length) {
        notesEl.innerHTML = "";
        return;
      }

      notesEl.innerHTML = `
        <h3 style="margin-top:16px;">AI Notes on Top 10</h3>
        <ul>
          ${notes.map(note => `<li><strong>${note.ticker}</strong>: ${note.comment}</li>`).join("")}
        </ul>
      `;
    }

    function renderCards(rows) {
      const container = document.getElementById("top10Cards");
      container.innerHTML = "";

      rows.slice(0, 10).forEach((row, idx) => {
        const risk = String(row["Earnings Risk"] || "").trim().toUpperCase();
        const riskClass = risk === "YES" ? "yes" : "no";
        const trend = String(row["Trend"] || "").trim().toLowerCase();
        const trendClass = ["up", "neutral", "down"].includes(trend) ? trend : "neutral";

        const otm = toNumber(row["OTM"]);
        const annualYield = toNumber(row["Annual Yield"]);
        const ivPct = toNumber(row["IV Percentile (Scan)"]);
        const spread = toNumber(row["Spread%"]);
        const roc = toNumber(row["Return on Capital"]);
        const ret20 = toNumber(row["20D Return"]);

        const card = document.createElement("div");
        card.className = "stock-card";
        card.innerHTML = `
          <div class="rank">#${idx + 1} candidate</div>
          <div class="ticker">${row["Ticker"] || "—"}</div>
          <div class="score">Final Score ${fmt(row["Final Score"], 2)}</div>

          <div class="stats">
            <div class="stat"><div class="label">Stock Price</div><div class="value">$${fmt(row["Current Stock Price"], 2)}</div></div>
            <div class="stat"><div class="label">Capital Needed</div><div class="value">$${fmt(row["Capital Required"], 0)}</div></div>
            <div class="stat"><div class="label">Premium</div><div class="value">$${fmt(row["Premium"], 0)}</div></div>
            <div class="stat"><div class="label">Weekly Income</div><div class="value">$${fmt(row["Weekly Income Estimate"], 0)}</div></div>
            <div class="stat"><div class="label">Return on Capital</div><div class="value">${roc !== null ? (roc * 100).toFixed(2) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">Delta</div><div class="value">${fmt(row["Delta"], 2)}</div></div>
            <div class="stat"><div class="label">Assignment Proxy</div><div class="value">${fmt(row["Assignment Proxy"], 2)}</div></div>
            <div class="stat"><div class="label">OTM</div><div class="value">${otm !== null ? (otm * 100).toFixed(1) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">Annual Yield</div><div class="value">${annualYield !== null ? (annualYield * 100).toFixed(1) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">20D Return</div><div class="value">${ret20 !== null ? (ret20 * 100).toFixed(1) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">Trend</div><div class="value"><span class="tag ${trendClass}">${row["Trend"] || "—"}</span></div></div>
            <div class="stat"><div class="label">Volume</div><div class="value">${fmtInt(row["Volume"])}</div></div>
            <div class="stat"><div class="label">Open Interest</div><div class="value">${fmtInt(row["Open Interest"])}</div></div>
            <div class="stat"><div class="label">IV Percentile</div><div class="value">${ivPct !== null ? ivPct.toFixed(0) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">Spread</div><div class="value">${spread !== null ? (spread * 100).toFixed(1) + "%" : "—"}</div></div>
            <div class="stat"><div class="label">Earnings Risk</div><div class="value"><span class="tag ${riskClass}">${risk || "—"}</span></div></div>
            <div class="stat"><div class="label">Expiration</div><div class="value">${row["Expiration"] || "—"}</div></div>
            <div class="stat"><div class="label">Strike / Bid / Ask</div><div class="value">${fmt(row["Strike"], 2)} / ${fmt(row["Bid"], 2)} / ${fmt(row["Ask"], 2)}</div></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function loadManifest() {
      const response = await fetch(MANIFEST_URL);
      if (!response.ok) throw new Error("Could not load reports_manifest.json");
      return await response.json();
    }

    async function loadReport(reportFile) {
      const response = await fetch(`published/${reportFile}?t=${Date.now()}`);
      if (!response.ok) throw new Error(`Could not load ${reportFile}`);
      const text = await response.text();
      return parseCSV(text);
    }

    async function loadSummary(summaryFile) {
      if (!summaryFile) return null;
      const response = await fetch(`published/${summaryFile}?t=${Date.now()}`);
      if (!response.ok) return null;
      return await response.json();
    }

    async function renderSelectedReport(manifest, dateValue) {
      let selected = manifest.reports.find(r => r.date === dateValue);

      if (!selected) {
        selected = manifest.reports[0];
      }

      if (!selected) {
        document.getElementById("bestTrade").textContent = "No reports found.";
        document.getElementById("aiSummary").textContent = "No reports found.";
        document.getElementById("top10Cards").innerHTML = "";
        return;
      }

      const rows = await loadReport(selected.report);
      const summary = await loadSummary(selected.summary);

      renderCards(rows);
      renderBestTrade(summary);
      renderAISummary(summary);
    }

    async function init() {
      try {
        const manifest = await loadManifest();
        const select = document.getElementById("reportSelect");
        select.innerHTML = manifest.reports
          .map(r => `<option value="${r.date}">${r.date}</option>`)
          .join("");

        const defaultDate = manifest.reports[0]?.date;
        await renderSelectedReport(manifest, defaultDate);

        select.addEventListener("change", async () => {
          await renderSelectedReport(manifest, select.value);
        });

        document.getElementById("reloadBtn").addEventListener("click", async () => {
          window.location.reload();
        });
      } catch (err) {
        document.getElementById("bestTrade").textContent = err.message;
        document.getElementById("aiSummary").textContent = err.message;
      }
    }

    init();
  </script>
</body>
</html>
